[package]
name = "battuta"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "The core of OliviaMIDI: read, change, compare and audition a Take."
license = "MIT"
repository = "https://github.com/JX-Shen/OliviaMIDI"
readme = "README.md"
keywords = ["midi", "music", "cli", "agent", "composition"]
categories = ["command-line-utilities", "multimedia::audio", "parser-implementations"]

# Agent operating instructions are how this repository is worked in, not part of
# what the crate ships. They also name the machine's account layout.
exclude = [".claude/", "AGENTS.md", "docs/agents/"]

[lib]
name = "battuta"
path = "src/lib.rs"

[[bin]]
name = "mid"
path = "src/bin/mid/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
midly = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
libc = "0.2"
midly = "0.5"
serde_json = "1"
predicates = "3"
tempfile = "3"
