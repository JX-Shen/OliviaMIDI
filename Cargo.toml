[package]
name = "battuta"
version = "0.1.3"
edition = "2021"
# Checked, not remembered: `cargo check --locked` and `cargo test --locked` on
# exactly this version, on every push (#21). 1.82 was declared and was never
# true — `tempfile` reaches `getrandom`, which needs a Cargo that has edition
# 2024, and 1.82's has not.
rust-version = "1.85"
description = "The core of OliviaMIDI: read, change, compare and audition a Take."
license = "MIT"
repository = "https://github.com/JX-Shen/OliviaMIDI"
readme = "README.md"
keywords = ["midi", "music", "cli", "agent", "composition"]
categories = ["command-line-utilities", "multimedia::audio", "parser-implementations"]

# The crate is exactly this list and nothing else (#55). A file the crate should
# carry is named here; a file not named here is not carried, whatever the tree
# holds. `Cargo.toml`, `Cargo.lock` and the `readme` above are added by Cargo.
# Once `include` is set, `.gitignore` is no longer consulted, and a pattern
# without a leading `/` matches at any depth — so every entry is anchored.
#
# What is in and why: the source; the charter, glossary and licence; the ADRs,
# which `src/` cites by number; and `docs/fixtures.md`, which is what a reader
# holding only the tarball checks a sourced fixture against. What is out: how
# this repository is worked in (`AGENTS.md` and its symlink, `docs/agents/`,
# `.claude/`), the tests and the fixtures they read (#35, and `CHARTER.md`'s
# *Distribution*), and working material under `docs/` that reads files the
# crate does not carry.
include = [
    "/src/**",
    "/CHARTER.md",
    "/CONTEXT.md",
    "/LICENSE",
    "/README.md",
    "/docs/adr/**",
    "/docs/fixtures.md",
]

[lib]
name = "battuta"
path = "src/lib.rs"

[[bin]]
name = "mid"
path = "src/bin/mid/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
midly = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

# Only what the tests need and the crate itself does not. `[dependencies]` is
# visible to the tests too, so anything named there would be named twice.
[dev-dependencies]
assert_cmd = "2"
predicates = "3"
