[package]
name = "battuta"
version = "0.1.2"
edition = "2021"
# Checked, not remembered: `cargo check --locked` and `cargo test --locked` on
# exactly this version, on every push (#21). 1.82 was declared and was never
# true — `tempfile` reaches `getrandom`, which needs a Cargo that has edition
# 2024, and 1.82's has not.
rust-version = "1.85"
description = "The core of OliviaMIDI: read, change, compare and audition a Take."
license = "MIT"
repository = "https://github.com/JX-Shen/OliviaMIDI"
readme = "README.md"
keywords = ["midi", "music", "cli", "agent", "composition"]
categories = ["command-line-utilities", "multimedia::audio", "parser-implementations"]

# Agent operating instructions are how this repository is worked in, not part of
# what the crate ships. They also name the machine's account layout.
#
# `CLAUDE.md` is a symlink to `AGENTS.md` and is excluded for the same reason —
# and it has to be named here, because excluding a file does not exclude a link
# to it: `cargo package` carries the link and publishes what it points at.
#
# The tests and what they read are the same kind of thing: they are what this
# repository is worked in, not what the crate is. Nobody who depends on
# `battuta` runs its integration tests, and `cargo package` compiles the crate
# without building them — so shipping them served no reader, while the sourced
# fixtures would have put somebody else's licence inside a crate whose own is
# one word. They go together because 116 of the suite's 311 tests read a
# fixture: shipping `tests/` without `fixtures/` offers a suite that cannot run
# (#35, and `CHARTER.md`'s *Distribution*).
exclude = [
    ".claude/",
    "AGENTS.md",
    "CLAUDE.md",
    "docs/agents/",
    "fixtures/",
    "tests/",
]

[lib]
name = "battuta"
path = "src/lib.rs"

[[bin]]
name = "mid"
path = "src/bin/mid/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
midly = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

# Only what the tests need and the crate itself does not. `[dependencies]` is
# visible to the tests too, so anything named there would be named twice.
[dev-dependencies]
assert_cmd = "2"
predicates = "3"
